<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAGUS4DE - Prediksi HK</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{background:#0e0e0e;padding:12px 15px;color:#ffcc00;font-weight:900;border-bottom:1px solid #222}
.wrap{padding:16px}
.judul{color:#ffcc00;font-weight:900;font-size:18px;margin-bottom:12px}
.card{background:#1c1c1e;border-radius:16px;padding:18px}
.item{margin:14px 0}
.lab{color:#8a8a8a;font-size:12px;letter-spacing:1px}
.val{font-weight:700;margin-top:5px;word-break:break-all;line-height:1.6;font-size:15px}
.val.yellow{color:#ffcc00}
</style>
</head>
<body>
<div class="top">BAGUS4DE - HK</div>
<div class="wrap">
  <div class="judul">Prediksi Bagus4de Pasaran HK hari ini!</div>
  <div class="card" id="box">Loading...</div>
</div>

<script>
async function load(){
  let r = await fetch('/api/index?pasaran=hk');
  let j = await r.json();
  console.log(j);
  // karena tabel kamu: pasaran | data(json)
  let d = j.prediksi ? j.prediksi.data : null;
  // fallback kalau api langsung balikin data
  if(!d && j.data) d = j.data;
  if(!d && j.prediksi && j.prediksi.bbfs) d = j.prediksi;

  if(!d) {
    document.getElementById('box').innerHTML = 'Data HK belum ada di Supabase';
    return;
  }

  document.getElementById('box').innerHTML = `
    <div class="item"><div class="lab">BBFS:</div><div class="val">${d.bbfs || '-'}</div></div>
    <div class="item"><div class="lab">4D:</div><div class="val yellow">${d['4d'] || d.d4 || '-'}</div></div>
    <div class="item"><div class="lab">3D:</div><div class="val">${d['3d'] || d.d3 || '-'}</div></div>
    <div class="item"><div class="lab">2D:</div><div class="val">${d['2d'] || d.d2 || '-'}</div></div>
  `;
}
load();
</script>
</body>
</html>
