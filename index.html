<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAGUS4DE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.header{position:sticky;top:0;z-index:10;background:#111;padding:12px 15px;border-bottom:1px solid #222;display:flex;gap:8px;align-items:center}
.logo{color:#ffcc00;font-weight:900}
.header button{border:none;padding:8px 16px;border-radius:20px;background:#222;color:#fff}
.header button.active{background:#ffcc00;color:#000;font-weight:700}
.wrap{padding:16px}
.card{background:#1c1c1e;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #222}
.pas{color:#ffcc00;font-weight:900;font-size:22px;margin-bottom:12px}
.row{display:block;width:100%;margin-bottom:14px}
.lab{font-size:11px;color:#777;letter-spacing:1px;margin-bottom:4px}
.val{font-size:16px;font-weight:700;line-height:1.8;word-break:break-all;white-space:normal}
.val.yellow{color:#ffcc00}
</style>
</head>
<body>
<div class="header">
  <span class="logo">BAGUS4DE</span>
  <button onclick="loadP('sdy')" id="b-sdy" class="active">SDY</button>
  <button onclick="loadP('sgp')" id="b-sgp">SGP</button>
  <button onclick="loadP('hk')" id="b-hk">HK</button>
</div>
<div class="wrap" id="wrap"></div>

<script>
async function loadP(active){
  document.querySelectorAll('.header button').forEach(b=>b.classList.remove('active'));
  document.getElementById('b-'+active).classList.add('active');
  document.getElementById('wrap').innerHTML='Loading...';
  let pasarans = ['hk','sdy','sgp'];
  // kalau klik HK, tampilkan HK di atas, dst
  if(active!=='all') pasarans = [active, ...pasarans.filter(p=>p!==active)];
  
  let html='';
  for(let p of pasarans){
    try{
      let r = await fetch('/api/index?pasaran='+p+'&t='+Date.now());
      let j = await r.json();
      let d = j.prediksi?.data || j.prediksi;
      if(!d) continue;
      html+=`
        <div class="card">
          <div class="pas">${p.toUpperCase()}</div>
          <div class="row"><div class="lab">BBFS</div><div class="val">${d.bbfs||'-'}</div></div>
          <div class="row"><div class="lab">4D JITU</div><div class="val yellow">${d['4d']||'-'}</div></div>
          <div class="row"><div class="lab">3D</div><div class="val">${d['3d']||'-'}</div></div>
          <div class="row"><div class="lab">2D</div><div class="val">${d['2d']||'-'}</div></div>
        </div>
      `;
    }catch(e){}
  }
  document.getElementById('wrap').innerHTML=html;
}
loadP('sdy');
</script>
</body>
</html>
