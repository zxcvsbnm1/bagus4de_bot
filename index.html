<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAGUS4DE</title>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}.top{background:#111;padding:12px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #222}.top a{text-decoration:none;padding:8px 14px;border-radius:20px;background:#222;color:#fff}.top a.on{background:#ffcc00;color:#000;font-weight:700}.wrap{padding:16px}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:16px}.item{border-bottom:1px solid #222;padding:12px 0}.item:last-child{border:0}.l{font-size:11px;color:#666;margin-bottom:5px}.v{font-size:17px;font-weight:700;word-break:break-all;line-height:1.5}.v.y{color:#ffcc00}</style>
</head><body>
<div class="top"><b style="color:#ffcc00;margin-right:6px">BAGUS4DE</b><a href="/?pasaran=sdy" id="a-sdy">SDY</a><a href="/?pasaran=sgp" id="a-sgp">SGP</a><a href="/?pasaran=hk" id="a-hk">HK</a></div>
<div class="wrap"><h2 id="judul" style="color:#ffcc00">Prediksi Hari Ini</h2><div class="card" id="box">Loading...</div></div>
<script>
(async()=>{
let p=new URLSearchParams(location.search).get('pasaran')||'hk';
document.getElementById('judul').innerText='Prediksi '+p.toUpperCase()+' Hari Ini';
let btn=document.getElementById('a-'+p);if(btn)btn.classList.add('on');
let res=await fetch('/api/index?pasaran='+p+'&t='+Date.now());
let json=await res.json();
let d=json.prediksi?.data||json.prediksi||{};
document.getElementById('box').innerHTML=`
<div class="item"><div class="l">BBFS</div><div class="v">${d.bbfs||''}</div></div>
<div class="item"><div class="l">4D JITU</div><div class="v y">${d['4d']||''}</div></div>
<div class="item"><div class="l">3D</div><div class="v">${d['3d']||''}</div></div>
<div class="item"><div class="l">2D</div><div class="v">${d['2d']||''}</div></div>
`;
})();
</script>
</body></html>
