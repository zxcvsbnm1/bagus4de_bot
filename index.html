<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0e0e0e;color:#fff;font-family:sans-serif}
  .top{background:#000;padding:10px;display:flex;gap:8px;overflow:auto;position:sticky;top:0}
  .top button{border:none;padding:8px 16px;border-radius:20px;background:#222;color:#fff}
  .top .active{background:#ffcc00;color:#000;font-weight:bold}
  #content{padding:12px;max-width:600px;margin:0 auto}
  .card{background:#1f1f1f;border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:10px}
  .lbl{font-size:10px;color:#777}
  .val{font-size:18px;font-weight:bold;word-break:break-all;line-height:1.4;margin-top:4px}
  .val.y{color:#ffcc00}
  /* PAKSA 1 KOLOM DI SEMUA LAYAR */
  .grid{display:block !important;grid-template-columns:1fr !important}
</style>
</head>
<body>
<div class="top">
  <b style="color:#ffcc00;line-height:32px">BAGUS4DE</b>
  <button id="b-home" class="active" onclick="go('home')">HOME</button>
  <button id="b-sdy" onclick="go('sdy')">SDY</button>
  <button id="b-sgp" onclick="go('sgp')">SGP</button>
  <button id="b-hk" onclick="go('hk')">HK</button>
</div>
<div id="content">Loading...</div>
<script>
async function go(p){
  document.querySelectorAll('.top button').forEach(b=>b.classList.remove('active'));
  let btn=document.getElementById('b-'+p); if(btn) btn.classList.add('active');
  let box=document.getElementById('content');
  if(p==='home'){
    box.innerHTML='Loading...'; let h='';
    for(let x of ['sdy','sgp','hk']){
      try{let r=await fetch('/api/index?pasaran='+x+'&t='+Date.now());let j=await r.json();let d=j.prediksi||j;
      h+=`<div class="card" onclick="go('${x}')"><div class="lbl">${x.toUpperCase()}</div><div class="val" style="font-size:14px">${d.bbfs||'-'}</div></div>`}catch{}
    }
    box.innerHTML=h; return;
  }
  box.innerHTML='Loading '+p+'...';
  try{
    let r=await fetch('/api/index?pasaran='+p+'&t='+Date.now());
    let j=await r.json(); let d=j.prediksi||j;
    // FIX undefined - tidak pakai d.pasaran lagi, pakai p langsung
    box.innerHTML=`
      <a href="javascript:go('home')" style="color:#888;text-decoration:none;font-size:13px">← Kembali ke Home</a>
      <h2 style="color:#ffcc00;font-size:32px;margin:10px 0">${p.toUpperCase()}</h2>
      <div class="grid">
        <div class="card"><div class="lbl">BBFS</div><div class="val">${d.bbfs||'-'}</div></div>
        <div class="card"><div class="lbl">4D JITU</div><div class="val y">${d['4d']||d.jitu4d||'-'}</div></div>
        <div class="card"><div class="lbl">3D</div><div class="val">${d['3d']||'-'}</div></div>
        <div class="card"><div class="lbl">2D</div><div class="val">${d['2d']||'-'}</div></div>
      </div>`;
  }catch(e){box.innerHTML='Error '+e}
}
go('home');
</script>
</body>
</html>
